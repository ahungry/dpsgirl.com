<!doctype html>
<html lang="en-us">
  <head>
    <link rel="stylesheet" type="text/css" href="main.css"/>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Parser</title>
  </head>
  <body>
    <p>
      Upload your log file (all local - it does not send to server):
    </p>
    <input type="file" id="fileInput" />

    <div class="querybox">
      Check the average damage per hit:
      <textarea class="query">
SELECT sum(val)/count(*) as avg
FROM dmg
WHERE typ='pierce'
AND tar = 'Drelzna'
</textarea>
    <button class="run">run</button>
    </div>

    <div class="querybox">
      Check a sample of imported log entries:
      <textarea class="query">
SELECT * FROM dmg LIMIT 5;
</textarea>
    <button class="run">run</button>
    </div>

    <pre id="results">
    </pre>
    <script src="jswasm/sqlite3-worker1-promiser.js"></script>
    <script src="parse.js"></script>
  </body>
</html>
